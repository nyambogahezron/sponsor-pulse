name: Continuous Integration

# Trigger the workflow automatically on pushes to main and on any pull requests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-verify-build:
    name: Lint & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up the Bun runtime using the official setup action
      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun dependencies to speed up the workflow
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Install all dependencies cleanly using the lockfile to ensure reproducible builds
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Run the Biome linter via the npm/bun script.
      # If Biome detects formatting or linting errors, it will exit with a non-zero code
      # and fail the pipeline immediately.
      - name: Static Analysis (Biome)
        run: bun run lint

      # Build the Docker image to verify the container compiles without crashing.
      # We target the Dockerfile located in the server app. This ensures that any infrastructure
      # changes don't break the build layer. We don't push this to a registry yet.
      - name: Verify Docker Build
        run: docker build -t sponsor-pulse-server:ci-test -f apps/server/Dockerfile apps/server/
