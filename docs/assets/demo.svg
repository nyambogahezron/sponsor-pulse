<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240">
  <rect width="780" height="240" rx="12" fill="#111" />
  <!-- video timeline -->
  <rect x="40" y="170" width="700" height="12" rx="6" fill="#333" />
  <rect id="playhead" x="40" y="166" width="8" height="20" rx="4" fill="#7b61ff">
    <animate attributeName="x" from="40" to="580" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- skip overlay appears mid animation -->
  <g id="overlay" opacity="0">
    <rect x="520" y="40" width="200" height="80" rx="8" fill="#000" fill-opacity="0.6" />
    <text x="620" y="90" font-size="20" fill="#fff" text-anchor="middle" font-family="Arial">Skip sponsor?</text>
    <rect x="570" y="100" width="120" height="36" rx="6" fill="#7b61ff" />
    <text x="630" y="125" font-size="16" fill="#fff" text-anchor="middle" font-family="Arial">Press S</text>
  </g>

  <animate xlink:href="#overlay" attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.75;0.9;1" dur="3s" repeatCount="indefinite" />

  <!-- play icon -->
  <polygon points="120,70 160,96 120,122" fill="#fff" opacity="0.9" />
</svg>
